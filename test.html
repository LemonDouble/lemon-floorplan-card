<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>lemon-floorplan-card · test harness</title>
<style>
  body { margin:0; padding:24px; background:#fff; color:#1c1c1e;
         font:14px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif;
         --card-background-color:#fff; --primary-text-color:#1c1c1e;
         --secondary-text-color:#6b7280; --secondary-background-color:#f1f3f6;
         --divider-color:#b9bec7; --state-icon-active-color:#f9a825; }
  .wrap { max-width:720px; }
  #log { margin-top:16px; padding:10px 12px; border-radius:8px; background:#f1f3f6;
         font:12px/1.6 ui-monospace,monospace; white-space:pre-wrap; }
</style>
<script type="module" src="./src/card.js"></script>
</head>
<body>
<div class="wrap">
  <div id="host"></div>
  <div id="log"></div>
</div>

<script type="module">
// ── 실제 인스턴스에서 뽑은 데이터로 만든 mock hass ───────────────
const AREAS = [
  {area_id:"geosil",name:"거실"}, {area_id:"cimsil",name:"침실"},
  {area_id:"jubang",name:"주방"}, {area_id:"jageunbang",name:"작은방"},
  {area_id:"hwajangsil",name:"화장실"}, {area_id:"hyeongwan",name:"현관"},
  {area_id:"ap_beranda",name:"앞 베란다"}, {area_id:"dwi_beranda",name:"뒤 베란다"},
];
const DEVICES = [
  {id:"dev_geosil_sw",   area_id:"geosil", name:"거실 벽 스위치"},
  {id:"dev_geosil_sofa", area_id:"geosil", name:"거실 소파등"},
  {id:"dev_geosil_ac",   area_id:"geosil", name:"거실 에어컨"},
  {id:"dev_geosil_th",   area_id:"geosil", name:"거실 온습도 센서"},
  // 이름이 "거실 …" 보다 앞이라 자동 탐색이 이쪽을 먼저 집는다.
  // 기기 내장 온도는 실온과 3도쯤 어긋나므로 rooms.geosil.env 가 이겨야 한다.
  {id:"dev_dehum",       area_id:"geosil", name:"가전 제습기"},
  {id:"dev_cimsil_th",   area_id:"cimsil", name:"침실 온습도 센서"},
  {id:"dev_router",      area_id:"geosil", name:"EFM Networks ipTIME AX2004M"},
  {id:"dev_cimsil_ac",   area_id:"cimsil", name:"침실 벽걸이 에어컨"},
  {id:"dev_cimsil_light",area_id:"cimsil", name:"침실 간접등"},
  {id:"dev_purifier",    area_id:"cimsil", name:"Mi Air Purifier 3/3H"},
  {id:"dev_hwajangsil",  area_id:"hwajangsil", name:"화장실 벽 스위치"},
  {id:"dev_doorlock",    area_id:"hyeongwan", name:"현관 도어락"},
];
const ENTITIES = [
  // 거실
  {entity_id:"switch.0x385b44fffec08207_top",    device_id:"dev_geosil_sw"},
  // 2구 스위치의 아래 구는 엔티티 레벨로 앞 베란다에 덮어씀 — 이게 제대로 갈리는지가 핵심
  {entity_id:"switch.0x385b44fffec08207_bottom", device_id:"dev_geosil_sw", area_id:"ap_beranda"},
  {entity_id:"light.geosil_sopadeung",           device_id:"dev_geosil_sofa"},
  {entity_id:"climate.geosil_eeokeon",           device_id:"dev_geosil_ac"},
  {entity_id:"select.geosil_eeokeon_pungryang",  device_id:"dev_geosil_ac"},
  {entity_id:"sensor.geosil_onseubdo_senseo_temperature_2", device_id:"dev_geosil_th"},
  {entity_id:"sensor.geosil_onseubdo_senseo_humidity_2",    device_id:"dev_geosil_th"},
  {entity_id:"sensor.ldh_7700_dehumidifier_temperature",    device_id:"dev_dehum"},
  {entity_id:"sensor.ldh_7700_dehumidifier_humidity",       device_id:"dev_dehum"},
  // 침실은 env 를 안 적었다 — 자동 탐색 경로가 살아 있는지 확인하는 쪽
  {entity_id:"sensor.cimsil_onseubdo_senseo_temperature",   device_id:"dev_cimsil_th"},
  {entity_id:"sensor.cimsil_onseubdo_senseo_humidity",      device_id:"dev_cimsil_th"},
  // entity_category 가 붙은 건 걸러져야 함
  {entity_id:"sensor.0x385b44fffec08207_linkquality", device_id:"dev_geosil_sw", entity_category:"diagnostic"},
  {entity_id:"button.geosil_sopadeung_identify", device_id:"dev_geosil_sofa", entity_category:"config"},
  {entity_id:"update.geosil_sopadeung",          device_id:"dev_geosil_sofa"},  // 도메인 미허용
  {entity_id:"light.hidden_thing",               device_id:"dev_geosil_sofa", hidden_by:"user"},
  // 공유기 노이즈 — exclude_devices 로 통째로 빠져야 함
  {entity_id:"sensor.router_download_speed",     device_id:"dev_router"},
  {entity_id:"sensor.router_upload_speed",       device_id:"dev_router"},
  {entity_id:"sensor.router_packets_sent",       device_id:"dev_router"},
  // 화장실 2구 스위치 — 같은 도메인이 둘이라 대표에 둘 다 나와야 함
  {entity_id:"switch.hwajangsil_hwanpunggi",     device_id:"dev_hwajangsil"},
  // 침실
  {entity_id:"climate.cimsil_byeokgeori_eeokeon",device_id:"dev_cimsil_ac"},
  {entity_id:"switch.geosil_eeokeon_mupung",           device_id:"dev_geosil_ac"},
  {entity_id:"switch.cimsil_byeokgeori_eeokeon_mupung",device_id:"dev_cimsil_ac"},
  {entity_id:"select.cimsil_byeokgeori_eeokeon_pungryang",   device_id:"dev_cimsil_ac"},
  {entity_id:"select.cimsil_byeokgeori_eeokeon_baram_banghyang", device_id:"dev_cimsil_ac"},
  {entity_id:"light.cimsil_ganjeobdeung",        device_id:"dev_cimsil_light"},
  {entity_id:"fan.zhimi_mb3_e9cc_air_purifier",  device_id:"dev_purifier"},
  // 화장실 / 현관
  {entity_id:"switch.hwajangsil_deung_seuwici",  device_id:"dev_hwajangsil"},
  {entity_id:"lock.0x00158d008b0be468",          device_id:"dev_doorlock"},
];
const S = (state, attrs={}) => ({ state, attributes: attrs });
const STATES = {
  "switch.0x385b44fffec08207_top":    S("on",  {friendly_name:"거실 천장등"}),
  "switch.0x385b44fffec08207_bottom": S("on",  {friendly_name:"전면 베란다 등"}),
  "light.geosil_sopadeung":           S("off", {friendly_name:"소파등"}),
  "climate.geosil_eeokeon":           S("cool",{friendly_name:"거실 에어컨", temperature:23}),
  "select.geosil_eeokeon_pungryang":  S("자동풍",{friendly_name:"풍량"}),
  "sensor.geosil_onseubdo_senseo_temperature_2": S("27.5",{friendly_name:"거실 온도", unit_of_measurement:"°C"}),
  "climate.cimsil_byeokgeori_eeokeon":S("off", {friendly_name:"침실 에어컨"}),
  "light.cimsil_ganjeobdeung":        S("on",  {friendly_name:"침실 간접등"}),
  "fan.zhimi_mb3_e9cc_air_purifier":  S("off", {friendly_name:"공기청정기"}),
  "switch.hwajangsil_deung_seuwici":  S("off", {friendly_name:"화장실 등"}),
  "switch.hwajangsil_hwanpunggi":     S("off", {friendly_name:"화장실 환풍기"}),
  "lock.0x00158d008b0be468":          S("locked",{friendly_name:"현관 도어락"}),
  "media_player.geosil_seupikeo":     S("idle",{friendly_name:"거실 스피커"}),
  "media_player.cimsil_seupikeo":     S("playing",{friendly_name:"침실 스피커"}),
  "switch.geosil_eeokeon_mupung":            S("off",{friendly_name:"무풍"}),
  "switch.cimsil_byeokgeori_eeokeon_mupung": S("on", {friendly_name:"무풍"}),
  "select.cimsil_byeokgeori_eeokeon_pungryang": S("자동풍",{friendly_name:"풍량", options:["자동풍","미풍","약풍","강풍","터보"]}),
  "select.cimsil_byeokgeori_eeokeon_baram_banghyang": S("상하",{friendly_name:"바람 방향", options:["고정","상하"]}),
  "sensor.router_download_speed":     S("31.2",{friendly_name:"다운로드 속도"}),
  "sensor.router_upload_speed":       S("8.4", {friendly_name:"업로드 속도"}),
  "sensor.router_packets_sent":       S("99123",{friendly_name:"보낸 패킷"}),
};

// 이번 구조 개편에서 연결한 엔티티들 (핫스팟/글로우 검증용)
Object.assign(STATES, {
  "switch.0x385b44fffec08207_bottom": S("on",  {friendly_name:"전면 베란다 등"}),
  "switch.cimsil_seuwici":            S("off", {friendly_name:"침실 등"}),
  "switch.jubang_seuwici":            S("on",  {friendly_name:"주방 등"}),
  "switch.0x8cf681fffe92a130_top":    S("off", {friendly_name:"작은 방 벽"}),
  "switch.0x8cf681fffe92a130_bottom": S("off", {friendly_name:"후면 베란다등"}),
  "switch.0x8cf681fffe94a09e_bottom": S("on",  {friendly_name:"화장실 환풍기"}),
  "switch.seumateukonsenteu":         S("on",  {friendly_name:"식물등"}),
  "cover.geosil_keoteun":             S("open",  {friendly_name:"거실 커튼"}),
  "cover.cimsil_keoteun":             S("closed",{friendly_name:"침실 커튼"}),
  "light.yeelink_strip6_3ebe_light":  S("off", {friendly_name:"라인조명"}),
  "media_player.lg_webos_bimpeurojegteo": S("off",{friendly_name:"프로젝터"}),
  "media_player.geosil_tv_adb":       S("playing",{friendly_name:"거실 TV"}),
  "media_player.jubang_seupikeo":     S("idle",{friendly_name:"주방 스피커"}),
  "humidifier.ldh_7700_dehumidifier": S("on", {friendly_name:"제습기"}),
  "humidifier.xiaomi_p3_6236_humidifier": S("off",{friendly_name:"가습기"}),
  "vacuum.enteopeuraijeu":            S("docked",{friendly_name:"로봇청소기"}),
  "sensor.lemon_weight":              S("70.1",{friendly_name:"몸무게"}),
  "sensor.setaggi_washer_machine_state": S("stop",{friendly_name:"세탁기"}),
  "sensor.geonjogi_dryer_machine_state": S("stop",{friendly_name:"건조기"}),
  "binary_sensor.ap_beranda_cangmunsenseo_contact": S("on",{friendly_name:"앞베란다 창문"}),
  "binary_sensor.0xa4c138816d4b88e1_contact": S("off",{friendly_name:"현관문"}),
});

// 온습도 센서. device_class 로 잡히므로 friendly_name 은 상관없다.
Object.assign(STATES, {
  "sensor.geosil_onseubdo_senseo_humidity_2": S("59.9", {friendly_name:"거실 습도", unit_of_measurement:"%", device_class:"humidity"}),
  "sensor.ldh_7700_dehumidifier_temperature": S("25",   {friendly_name:"제습기 온도", unit_of_measurement:"°C", device_class:"temperature"}),
  "sensor.ldh_7700_dehumidifier_humidity":    S("76",   {friendly_name:"제습기 습도", unit_of_measurement:"%", device_class:"humidity"}),
  "sensor.cimsil_onseubdo_senseo_temperature":S("27.6", {friendly_name:"침실 온도", unit_of_measurement:"°C", device_class:"temperature"}),
  "sensor.cimsil_onseubdo_senseo_humidity":   S("68.3", {friendly_name:"침실 습도", unit_of_measurement:"%", device_class:"humidity"}),
});
STATES["sensor.geosil_onseubdo_senseo_temperature_2"].attributes.device_class = "temperature";
STATES["sensor.geosil_onseubdo_senseo_temperature_2"].state = "28.3";

// 실외. weather 는 상태가 "맑음/흐림" 이고 온·습도는 속성에 들어 있다.
Object.assign(STATES, {
  "weather.forecast_jib": S("partlycloudy",
    {friendly_name:"집 날씨", temperature:26.4, humidity:71, temperature_unit:"°C"}),
});

// 공기질. 라벨·단위·등급은 device_class 로 정해지므로 이게 없으면 줄 자체가 안 생긴다.
// 값은 등급이 섞이게 골랐다 — CO2 좋음(색 없음) / PM2.5 주의 / PM10 보통.
Object.assign(STATES, {
  "sensor.air_detector":      S("612", {friendly_name:"CO2",   unit_of_measurement:"ppm",   device_class:"carbon_dioxide"}),
  "sensor.air_detector_pm25": S("42",  {friendly_name:"PM2.5", unit_of_measurement:"㎍/㎥", device_class:"pm25"}),
  "sensor.air_detector_pm10": S("58",  {friendly_name:"PM10",  unit_of_measurement:"㎍/㎥", device_class:"pm10"}),
});
const calls = [];
const hass = {
  states: STATES,
  callService: (d,s,x) => { calls.push([d,s,x]); },
  callWS: async ({type}) => ({
    "config/area_registry/list":   AREAS,
    "config/device_registry/list": DEVICES,
    "config/entity_registry/list": ENTITIES,
  }[type]),
};

// ── 구동 ───────────────────────────────────────────────────────
const card = document.createElement("lemon-floorplan-card");
card.setConfig({
  floorplan: "./floorplan.svg",
  title: "우리집",
  exclude_devices: ["EFM Networks ipTIME AX2004M"],
  air: ["sensor.air_detector", "sensor.air_detector_pm25", "sensor.air_detector_pm10"],
  outdoor: "weather.forecast_jib",
  rooms: {
    geosil: { pin: ["switch.geosil_eeokeon_mupung", "select.geosil_eeokeon_pungryang"],
              env: ["sensor.geosil_onseubdo_senseo_temperature_2",
                    "sensor.geosil_onseubdo_senseo_humidity_2"] },
    cimsil: { pin: ["switch.cimsil_byeokgeori_eeokeon_mupung",
                    "select.cimsil_byeokgeori_eeokeon_pungryang",
                    "select.cimsil_byeokgeori_eeokeon_baram_banghyang"] },
  },
  aliases: {
    "ceiling-geosil": "switch.0x385b44fffec08207_top",
    "ceiling-ap-beranda": "switch.0x385b44fffec08207_bottom",
    "ceiling-jageunbang": "switch.0x8cf681fffe92a130_top",
    "ceiling-dwi-beranda": "switch.0x8cf681fffe92a130_bottom",
    "fan-hwajangsil": "switch.0x8cf681fffe94a09e_bottom",
    "lock-hyeongwan": "lock.0x00158d008b0be468",
    "contact-hyeongwan": "binary_sensor.0xa4c138816d4b88e1_contact",
  },
});
document.getElementById("host").appendChild(card);
card.hass = hass;

// 카드가 준비될 때까지 대기 후 결과를 전역에 노출
window.__ready = new Promise((resolve) => {
  const t = setInterval(() => {
    if (!card._ready) return;
    clearInterval(t);
    resolve();
  }, 30);
});
window.__card = card;
window.__hass = hass;
window.__calls = calls;
window.__setState = (eid, st) => {
  STATES[eid] = { ...STATES[eid], state: st };
  card.hass = { ...hass, states: { ...STATES } };
};
</script>

<script type="module">
// 카드 편집기 하네스: HA 가 하는 일(setConfig + config-changed 수신)을 흉내낸다
const ed = document.createElement("lemon-floorplan-card-editor");
ed.style.cssText = "display:block;max-width:720px;margin-top:32px";
let live = { type: "custom:lemon-floorplan-card", floorplan: "./floorplan.svg" };
ed.addEventListener("config-changed", (e) => { live = e.detail.config; });
document.querySelector(".wrap").appendChild(
  Object.assign(document.createElement("h3"), {textContent: "카드 편집기", style: "margin-top:32px"}));
document.querySelector(".wrap").appendChild(ed);
ed.setConfig(live);
window.__editor = ed;
window.__liveConfig = () => live;
</script>
</body>
</html>
