<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 810" id="lemon-floorplan" role="img" aria-label="집 평면도">
  <!--
    좌표계
      viewBox 920 x 810 / 건물 외곽 (60,40) ~ (860,770)

      X 그리드                                        Y 그리드
        60  좌측 외벽                                   40  상단 외벽
       200  화장실 우측벽                               155  앞베란다 / 거실·침실
       361  현관 단차 경계 (벽 아님)                    310  화장실 상단
       430  거실/침실 경계 · 주방 좌측                  405  침실 하단 · 주방·작은방 상단
            (y405 아래는 벽 없이 트임)                  455  거실 하단 · 현관 상단
       620  주방 / 작은방                               515  화장실·현관 하단 (외벽)
       820  침실 · 앞베란다 우측                        635  주방·작은방 하단 · 뒷베란다 상단
       860  작은방 · 뒷베란다 우측                      770  하단 외벽

    레이어 순서 (아래 → 위)
      fp-floor      바닥 재질. defs 의 방 도형을 <use> 로 재사용
      fp-furniture  가구. <image> 를 여기에 넣는다
      fp-rooms      히트영역 + 상태 틴트. 기본 투명, 카드가 data-tint 를 붙이면 물든다
      벽 / 창 / 단차 / 문
      fp-labels     방 이름 (+ 카드가 그 아래에 온습도 <text class="env"> 를 붙인다)

    방 도형은 defs 에 한 번만 정의하고 두 레이어가 <use> 로 공유한다.
    좌표를 고칠 때 한 군데만 고치면 된다.

    카드와의 계약은 area_id 두 군데뿐이다.
      <use id="room-*">        방 히트영역·틴트   (id 가 area_id)
      <text data-area="*">     방 이름 라벨       (온습도를 붙일 자리. 없으면 안 붙는다)
  -->

  <style>
    #lemon-floorplan {
      --fp-floor:   var(--secondary-background-color, #f1f3f6);
      --fp-floor-2: color-mix(in srgb, var(--secondary-background-color, #f1f3f6) 88%, var(--primary-text-color, #1c1c1e));
      --fp-grain:   color-mix(in srgb, var(--divider-color, #b9bec7) 55%, transparent);
      --fp-wall:    var(--primary-text-color, #1c1c1e);
      --fp-line:    var(--divider-color, #b9bec7);
      --fp-label:   var(--secondary-text-color, #6b7280);
    }

    /* 바닥 재질 */
    .fl-base   { fill: var(--fp-floor); }
    .fl-base2  { fill: var(--fp-floor-2); }
    .fl-grain  { fill: none; stroke: var(--fp-grain); stroke-width: 1.2; }
    .floor.wood { fill: url(#fp-wood); }
    .floor.tile { fill: url(#fp-tile); }

    /* 히트영역 + 틴트. 기본은 투명하고 카드가 data-tint 로 물들인다 */
    .room {
      fill: var(--state-icon-active-color, #f9a825);
      fill-opacity: 0;
      pointer-events: all;
      cursor: pointer;
      transition: fill-opacity .25s ease, fill .25s ease;
    }
    .room:hover { fill-opacity: .14; }

    .wall     { fill: none; stroke: var(--fp-wall); stroke-width: 11; stroke-linecap: square; }
    .wall-in  { fill: none; stroke: var(--fp-wall); stroke-width: 8;  stroke-linecap: square; }
    .window   { fill: none; stroke: var(--fp-line); stroke-width: 4; }
    .door     { fill: none; stroke: var(--fp-line); stroke-width: 3; }
    /* 벽이 아니라 바닥 마감이 바뀌는 경계(현관 단차 등) */
    .threshold{ fill: none; stroke: var(--fp-line); stroke-width: 3; stroke-dasharray: 9 7; }

    .label {
      fill: var(--fp-label);
      font: 600 24px/1 system-ui, -apple-system, "Noto Sans KR", sans-serif;
      text-anchor: middle; dominant-baseline: central;
      pointer-events: none; user-select: none;
    }
    .label.sm { font-size: 19px; }

    /* 라벨은 fp-labels(가구보다 위) 라 가구에 가려지진 않지만, 조명이 켜지면 그
       발광 위에 글자가 놓여 대비가 죽는다. 바닥색 외곽선을 먼저 깔아 글자를
       띄운다 — 지도 라벨에서 쓰는 halo 다. paint-order 가 없으면 stroke 가
       글자를 덮어 뭉개므로 반드시 stroke 를 fill 보다 먼저 칠하게 둘 것. */
    .label, .env {
      paint-order: stroke fill;
      stroke: var(--fp-floor); stroke-opacity: .85;
      stroke-width: 4.5px; stroke-linejoin: round;
    }

    /* 방 이름 아래 온·습도. 카드가 런타임에 채운다 (data-area 가 붙은 라벨만).
       방 이름보다 한 단계 작고 흐리게 — 평면도를 읽는 데 방해되면 안 된다. */
    .env {
      fill: var(--fp-label); opacity: .75;
      font: 500 17px/1 system-ui, -apple-system, "Noto Sans KR", sans-serif;
      text-anchor: middle; dominant-baseline: central;
      pointer-events: none; user-select: none;
    }

    #fp-furniture image { pointer-events: none; }
  </style>

  <defs>
    <!-- 마루: 세로 이음매가 줄마다 어긋나게 2줄짜리 타일 -->
    <pattern id="fp-wood" width="150" height="52" patternUnits="userSpaceOnUse">
      <rect class="fl-base" width="150" height="52"/>
      <path class="fl-grain" d="M0,26 H150 M0,52 H150 M45,0 V26 M115,26 V52"/>
    </pattern>

    <!-- 타일: 정사각 그리드 -->
    <pattern id="fp-tile" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect class="fl-base2" width="36" height="36"/>
      <path class="fl-grain" d="M36,0 V36 M0,36 H36"/>
    </pattern>

    <!-- 방 도형 원본. fp-floor 와 fp-rooms 가 <use> 로 공유한다 -->
    <polygon id="p-ap_beranda"  points="60,40 820,40 820,155 60,155"/>
    <polygon id="p-geosil"      points="60,155 430,155 430,515 361,515 361,455 200,455 200,310 60,310"/>
    <polygon id="p-cimsil"      points="430,155 820,155 820,405 430,405"/>
    <polygon id="p-hwajangsil"  points="60,310 200,310 200,515 60,515"/>
    <polygon id="p-hyeongwan"   points="200,455 361,455 361,515 200,515"/>
    <polygon id="p-jubang"      points="430,405 620,405 620,635 430,635"/>
    <polygon id="p-jageunbang"  points="620,405 860,405 860,635 620,635"/>
    <polygon id="p-dwi_beranda" points="430,635 860,635 860,770 430,770"/>
  </defs>

  <!-- ── 바닥 재질 ──────────────────────────────────────────── -->
  <g id="fp-floor">
    <use href="#p-geosil"      class="floor wood"/>
    <use href="#p-cimsil"      class="floor wood"/>
    <use href="#p-jageunbang"  class="floor wood"/>
    <use href="#p-jubang"      class="floor tile"/>
    <use href="#p-hwajangsil"  class="floor tile"/>
    <use href="#p-hyeongwan"   class="floor tile"/>
    <use href="#p-ap_beranda"  class="floor tile"/>
    <use href="#p-dwi_beranda" class="floor tile"/>
  </g>

  <!-- ── 가구 ───────────────────────────────────────────────────
       href 는 이 SVG 기준 상대경로다. floorplan.svg 옆에 fp/ 를 두면 된다.
       (HA: /local/floorplan.svg + /local/fp/*.webp)

       각 <image> 의 x,y,width,height 는 "이 상자 안에 넣어라" 라는 뜻이고,
       preserveAspectRatio 기본값(xMidYMid meet) 덕에 비율은 알아서 유지된다.
       위치를 옮기려면 x,y 만 고치면 된다. preview.html 의 "좌표 찍기" 참고. -->
  <g id="fp-furniture">
    <!-- data-entity 가 붙은 것은 카드가 클릭 핫스팟을 만들고 more-info 를 띄운다.
         없는 것은 장식이라 클릭이 방 폴리곤으로 그대로 떨어진다.
         좌표는 editor.html 에서 배치한 결과다. -->
    <image id="o-ceiling-light-1" href="fp/ceiling-light.webp" data-entity="@ceiling-ap-beranda" x="416.4" y="114.4" width="30" height="30"/>
    <image id="o-plants-1" href="fp/plants.webp" data-entity="switch.seumateukonsenteu" x="317" y="45.7" width="60" height="64"/>
    <image id="o-contact-sensor-1" href="fp/contact-sensor.webp" data-entity="binary_sensor.ap_beranda_cangmunsenseo_contact" x="690" y="48" width="26" height="13"/>
    <image id="o-plant-shelf-1" href="fp/plant-shelf.webp" x="378.3" y="45.2" width="84.6" height="40.4"/>
    <image id="o-ac-outdoor-1" href="fp/ac-outdoor.webp" x="460.9" y="43.5" width="85.1" height="63.8"/>
    <image id="o-ceiling-light-2" href="fp/ceiling-light.webp" data-entity="@ceiling-geosil" x="270.5" y="285.9" width="36" height="36"/>
    <image id="o-curtain-1" href="fp/curtain-panel.webp" data-curtain="" data-entity="cover.geosil_keoteun" x="91.1" y="155.8" width="309.7" height="16.7"/>
    <image id="o-table-lamp-1" href="fp/table-lamp.webp" data-entity="light.geosil_sopadeung" x="129.5" y="175.8" width="27" height="27"/>
    <image id="o-led-strip-1" href="fp/led-strip.webp" data-entity="light.yeelink_strip6_3ebe_light" x="491.5" y="581" width="94" height="7.9" transform="rotate(-90 538.5 585)"/>
    <image id="o-tv-stand-1" href="fp/tv-stand.webp" data-entity="media_player.geosil_tv_adb" x="339.8" y="221.9" width="134.3" height="37.1" transform="rotate(-90 407 240.5)"/>
    <image id="o-speaker-1" href="fp/speaker.webp" data-entity="media_player.jubang_seupikeo" x="463.8" y="569.1" width="24" height="24"/>
    <image id="o-ac-stand-1" href="fp/ac-stand.webp" data-entity="climate.geosil_eeokeon" x="345.7" y="170.6" width="37" height="38"/>
    <image id="o-dehumidifier-1" href="fp/dehumidifier.webp" data-entity="humidifier.ldh_7700_dehumidifier" x="197.7" y="410.9" width="42" height="32" transform="rotate(-90 218.7 426.9)"/>
    <image id="o-humidifier-1" href="fp/humidifier.webp" data-entity="humidifier.xiaomi_p3_6236_humidifier" x="778.2" y="47" width="35.1" height="35.1"/>
    <image id="o-sofa-1" href="fp/sofa.webp" x="30.5" y="207.4" width="132.7" height="61.7" transform="rotate(-90 96.9 238.2)"/>
    <image id="o-table-white-1" href="fp/table-white.webp" x="468.5" y="564.7" width="84.8" height="48.3" transform="rotate(-90 510.9 588.8)"/>
    <image id="o-ceiling-light-3" href="fp/ceiling-light.webp" data-entity="switch.cimsil_seuwici" x="567.9" y="254.2" width="34" height="34"/>
    <image id="o-curtain-2" href="fp/curtain-panel.webp" data-curtain="" data-entity="cover.cimsil_keoteun" x="443.9" y="151.7" width="341.7" height="26.6"/>
    <image id="o-ac-wall-1" href="fp/ac-wall.webp" data-entity="climate.cimsil_byeokgeori_eeokeon" x="398" y="211.4" width="95.1" height="21" transform="rotate(-90 445.6 221.9)"/>
    <image id="o-speaker-2" href="fp/speaker.webp" data-entity="media_player.cimsil_seupikeo" x="785.8" y="248.4" width="24" height="24"/>
    <image id="o-projector-1" href="fp/projector.webp" data-entity="media_player.lg_webos_bimpeurojegteo" x="515.3" y="262.6" width="38" height="28" transform="rotate(-90 534.3 276.6)"/>
    <image id="o-air-purifier-1" href="fp/air-purifier.webp" data-entity="fan.zhimi_mb3_e9cc_air_purifier" x="620.2" y="185.6" width="38.2" height="38.2"/>
    <image id="o-floor-lamp-1" href="fp/floor-lamp.webp" data-entity="light.cimsil_ganjeobdeung" x="573.5" y="363.5" width="33.7" height="33.7"/>
    <image id="o-air-monitor-1" href="fp/air-monitor.webp" data-entity="sensor.air_detector" x="765.8" y="175.2" width="22" height="22"/>
    <image id="o-bed-1" href="fp/bed.webp" x="673.5" y="258.8" width="125" height="157" transform="rotate(90 736 337.3)"/>
    <image id="o-wardrobe-1" href="fp/wardrobe.webp" x="396.7" y="676.5" width="129.2" height="50.6" transform="rotate(-90 461.3 701.8)"/>
    <image id="o-wardrobe-white-1" href="fp/wardrobe-white.webp" x="730.8" y="450.6" width="163" height="81.5" transform="rotate(-90 812.3 491.4)"/>
    <image id="o-ceiling-light-4" href="fp/ceiling-light.webp" data-entity="switch.hwajangsil_deung_seuwici" x="150.4" y="439.6" width="33.7" height="33.7"/>
    <image id="o-exhaust-fan-1" href="fp/exhaust-fan.webp" data-entity="@fan-hwajangsil" x="67.5" y="313.1" width="35.3" height="35.3"/>
    <image id="o-toilet-1" href="fp/toilet.webp" x="77.8" y="457.4" width="38" height="64" transform="rotate(-90 96.8 489.4)"/>
    <image id="o-washbasin-1" href="fp/washbasin.webp" x="61.9" y="414.2" width="50.9" height="54.1" transform="rotate(-90 87.4 441.2)"/>
    <image id="o-door-lock-1" href="fp/door-lock.webp" data-entity="@lock-hyeongwan" x="240.1" y="492.1" width="25.6" height="24.1" transform="rotate(90 252.9 504.1)"/>
    <image id="o-contact-sensor-2" href="fp/contact-sensor.webp" data-entity="@contact-hyeongwan" x="312" y="500" width="24" height="12"/>
    <image id="o-ceiling-light-5" href="fp/ceiling-light.webp" data-entity="switch.jubang_seuwici" x="507.7" y="468" width="32" height="32"/>
    <image id="o-speaker-3" href="fp/speaker.webp" data-entity="media_player.geosil_seupikeo" x="400.1" y="309.7" width="22" height="22"/>
    <image id="o-fridge-1" href="fp/fridge.webp" x="433.9" y="595.6" width="55" height="38.2" transform="rotate(-180 461.5 614.7)"/>
    <image id="o-sink-counter-1" href="fp/sink-counter.webp" x="537" y="556.3" width="113.2" height="44.5" transform="rotate(-270 593.6 578.5)"/>
    <image id="o-ceiling-light-6" href="fp/ceiling-light.webp" data-entity="@ceiling-jageunbang" x="714.7" y="484.3" width="32" height="32"/>
    <image id="o-vacuum-dock-1" href="fp/vacuum-dock.webp" data-entity="vacuum.enteopeuraijeu" x="627.7" y="584.1" width="45.3" height="48.8" transform="rotate(90 650.4 608.5)"/>
    <image id="o-scale-1" href="fp/scale.webp" data-entity="sensor.lemon_weight" x="391.3" y="338.7" width="34" height="34" transform="rotate(-90 408.3 355.7)"/>
    <image id="o-desk-1" href="fp/desk.webp" x="657.9" y="171.3" width="118" height="88.8"/>
    <image id="o-shelf-unit-1" href="fp/shelf-unit.webp" x="23.1" y="87.3" width="111.2" height="23.3" transform="rotate(-90 78.7 99)"/>
    <image id="o-ceiling-light-7" href="fp/ceiling-light.webp" data-entity="@ceiling-dwi-beranda" x="624.8" y="661.4" width="33.7" height="33.7"/>
    <image id="o-washer-1" href="fp/washer.webp" data-entity="sensor.setaggi_washer_machine_state" x="796.4" y="644.5" width="63.4" height="53.9" transform="rotate(90 828.1 671.4)"/>
    <image id="o-dryer-1" href="fp/dryer.webp" data-entity="sensor.geonjogi_dryer_machine_state" x="796.5" y="706.8" width="59.4" height="55.1" transform="rotate(90 826.2 734.3)"/>
  </g>

  <!-- ── 히트영역 + 상태 틴트 ───────────────────────────────── -->
  <g id="fp-rooms">
    <use href="#p-ap_beranda"  id="room-ap_beranda"  class="room"/>
    <use href="#p-geosil"      id="room-geosil"      class="room"/>
    <use href="#p-cimsil"      id="room-cimsil"      class="room"/>
    <use href="#p-hwajangsil"  id="room-hwajangsil"  class="room"/>
    <use href="#p-hyeongwan"   id="room-hyeongwan"   class="room"/>
    <use href="#p-jubang"      id="room-jubang"      class="room"/>
    <use href="#p-jageunbang"  id="room-jageunbang"  class="room"/>
    <use href="#p-dwi_beranda" id="room-dwi_beranda" class="room"/>
  </g>

  <!-- ── 창 (벽이 끊긴 구간을 얇은 선으로) ──────────────────── -->
  <g id="fp-windows">
    <path class="window" d="M105,155 H385"/>   <!-- 거실 ↔ 앞베란다 -->
    <path class="window" d="M475,155 H790"/>   <!-- 침실 ↔ 앞베란다 -->
    <path class="window" d="M513,635 H592"/>   <!-- 주방 ↔ 뒷베란다 -->
    <path class="window" d="M678,635 H812"/>   <!-- 작은방 ↔ 뒷베란다 -->
  </g>

  <!-- ── 외벽. 하단 x270~305 은 현관문 자리라 비워 둔다 ─────── -->
  <g id="fp-walls-outer">
    <path class="wall" d="M60,40 H820"/>
    <path class="wall" d="M820,40 V405 H860 V770"/>
    <path class="wall" d="M860,770 H430 V515 H305"/>
    <path class="wall" d="M260,515 H60 V40"/>
  </g>

  <!-- ── 내벽 ───────────────────────────────────────────────── -->
  <g id="fp-walls-inner">
    <!-- 앞베란다 ↔ 거실·침실. 창 2곳(거실 105~385 / 침실 475~790)만큼 끊는다.
         양쪽 다 방 양 끝에서 45 씩만 남기므로 창 비율이 서로 비슷해진다 -->
    <path class="wall-in" d="M60,155 H105"/>
    <path class="wall-in" d="M385,155 H475"/>
    <path class="wall-in" d="M790,155 H820"/>

    <!-- 거실 ↔ 침실. 침실 하단(y405)에서 끝난다.
         그 아래 x430 은 거실과 주방이 벽 없이 트인 구간이라 아무것도 그리지 않는다 -->
    <path class="wall-in" d="M430,155 V405"/>

    <!-- 침실 ↔ 주방 (x445~515 침실 문) -->
    <path class="wall-in" d="M430,405 H445"/>
    <path class="wall-in" d="M515,405 H860"/>

    <!-- 주방 ↔ 작은방 (y425~495 작은방 문) -->
    <path class="wall-in" d="M620,405 V425"/>
    <path class="wall-in" d="M620,495 V635"/>

    <!-- 주방·작은방 ↔ 뒷베란다 (창 2곳 제외) -->
    <path class="wall-in" d="M430,635 H513"/>
    <path class="wall-in" d="M592,635 H678"/>
    <path class="wall-in" d="M812,635 H860"/>

    <!-- 화장실 (y325~395 화장실 문) -->
    <path class="wall-in" d="M60,310 H200"/>
    <path class="wall-in" d="M200,310 V325"/>
    <path class="wall-in" d="M200,395 V515"/>

    <!-- 현관은 벽 없이 거실과 트여 있다. 경계는 fp-thresholds 의 단차선으로만 표시 -->
  </g>

  <!-- ── 단차 (벽 아님) ─────────────────────────────────────── -->
  <g id="fp-thresholds">
    <path class="threshold" d="M200,455 H361 V515"/>   <!-- 현관 ↔ 거실 -->
  </g>

  <!-- ── 문 (호형) ──────────────────────────────────────────── -->
  <g id="fp-doors">
    <path class="door" d="M445,405 V335 A70,70 0 0 1 515,405"/>   <!-- 침실 -->
    <path class="door" d="M620,425 H690 A70,70 0 0 1 620,495"/>   <!-- 작은방 -->
    <path class="door" d="M200,325 H130 A70,70 0 0 0 200,395"/>   <!-- 화장실 -->
    <path class="door" d="M305,515 V470 A45,45 0 0 0 260,515"/>   <!-- 현관 (출입문) -->
  </g>

  <!-- ── 라벨 ───────────────────────────────────────────────── -->
  <g id="fp-labels">
    <!-- 좌표는 방 중앙이 아니라 "가구 사이 빈 바닥" 에 손으로 맞춘 값이다.
         온습도 줄이 라벨 아래 21px 에 붙으므로 두 줄이 함께 들어갈 자리라야 한다.
         가구를 크게 옮기면 여기도 다시 맞출 것. 옆 주석이 그때의 근거다. -->
    <text class="label"    data-area="ap_beranda"  x="225" y="88">앞 베란다</text>   <!-- 선반(~134)과 화분(317~) 사이 -->
    <text class="label"    data-area="geosil"      x="240" y="228">거실</text>       <!-- 소파(~164)와 TV장(340~) 사이, 천장등 발광 위 -->
    <text class="label"    data-area="cimsil"      x="545" y="224">침실</text>       <!-- 벽걸이에어컨(~493)과 공기청정기(620~) 사이 -->
    <text class="label sm" data-area="hwajangsil"  x="150" y="385">화장실</text>     <!-- 세면대(~113)와 제습기(198~) 사이 -->
    <text class="label sm" data-area="hyeongwan"   x="228" y="472">현관</text>       <!-- 도어락(y492~) 위 -->
    <text class="label"    data-area="jubang"      x="525" y="525">주방</text>
    <text class="label"    data-area="jageunbang"  x="740" y="553">작은방</text>     <!-- 옷장(y~533) 아래, 청소기독(x~673) 오른쪽 -->
    <text class="label"    data-area="dwi_beranda" x="700" y="730">뒷베란다</text>   <!-- 천장등(y~695) 아래, 세탁기(x796~) 왼쪽 -->
  </g>
</svg>
